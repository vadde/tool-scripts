# ==============================================================================
# Omni-Graph Docker Compose Orchestration
# Architecture: 4 services on isolated omni-net bridge network
# Purpose-built for Apple Silicon ARM64 unified memory
# ==============================================================================

networks:
  omni-net:
    name: omni-net
    driver: bridge

volumes:
  surreal_data:
    name: omni_surreal_data
  tei_cache:
    name: omni_tei_cache

services:
  # ─── 1. Graph Database: SurrealDB v2 + HNSW Vector Engine ─────────────────
  graph-db:
    image: surrealdb/surrealdb:v2
    container_name: omni-graph-db
    user: "0:0"
    entrypoint:
      - /surreal
      - start
      - --log
      - info
      - --user
      - root
      - --pass
      - root
      - --bind
      - 0.0.0.0:8000
      - surrealkv:/data/omni.db
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/data
    networks:
      - omni-net
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  # ─── 2. Local Embedding Inference: HuggingFace TEI (ARM64 CPU / SIMD) ──────
  embedding-engine:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9
    container_name: omni-embedding-engine
    command:
      - --model-id
      - BAAI/bge-small-en-v1.5
      - --port
      - "80"
    ports:
      - "8081:80"
    volumes:
      - tei_cache:/data
    networks:
      - omni-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 25
      start_period: 10s
    restart: unless-stopped

  # ─── 3. Rust Orchestrator: Axum + Tree-Sitter + Graph Engine ──────────────
  rust-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-rust-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SURREAL_URL=http://graph-db:8000
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_NS=omni
      - SURREAL_DB=graph
      - TEI_URL=http://embedding-engine:80
      - BROWSE_ROOTS=/workspace,${HOST_MOUNT:-/Users}
      - RUST_LOG=info
    depends_on:
      graph-db:
        condition: service_healthy
      embedding-engine:
        condition: service_healthy
    volumes:
      - ../../:/workspace:ro
      - ${HOST_MOUNT:-/Users}:${HOST_MOUNT:-/Users}:ro
    networks:
      - omni-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ─── 4. React UI: Cosmograph WebGL Force-Directed Graph Visualizer ─────────
  graph-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: omni-graph-ui
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      rust-app:
        condition: service_started
    networks:
      - omni-net
    restart: unless-stopped
