# ============================================================================
# ci.yml — Main CI Pipeline
#
# Triggers on push/PR to main and develop branches.
# Detects changed tools and dispatches per-tool CI.
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect Changed Tools ────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Tools
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.changes.outputs.tools }}
      has_tools: ${{ steps.changes.outputs.has_tools }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed tool directories
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
              BASE=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
            fi
          fi

          # Find changed tools from tools/ and specs/catalog/
          CHANGED_FROM_TOOLS=$(git diff --name-only "$BASE" HEAD 2>/dev/null | \
            grep '^tools/' | \
            grep -v '^tools/_template/' | \
            grep -v '^tools/README.md' | \
            cut -d'/' -f2 || true)

          CHANGED_FROM_SPECS=$(git diff --name-only "$BASE" HEAD 2>/dev/null | \
            grep '^specs/catalog/' | \
            sed 's|^specs/catalog/||' | \
            sed 's|\.md$||' || true)

          # Combine and filter only valid tool directories
          CHANGED_TOOLS=$(printf "%s\n%s\n" "$CHANGED_FROM_TOOLS" "$CHANGED_FROM_SPECS" | \
            sort -u | \
            while read -r tool; do
              if [ -n "$tool" ] && [ -d "tools/$tool" ] && [ "$tool" != "_template" ]; then
                echo "$tool"
              fi
            done | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          # If manually triggered via workflow_dispatch and no changes detected, run all tools
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${CHANGED_TOOLS}" = "[]" ]; then
            CHANGED_TOOLS=$(find tools -mindepth 1 -maxdepth 1 -type d -not -name '_template' -exec basename {} \; | \
              sort | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          echo "tools=${CHANGED_TOOLS}" >> "$GITHUB_OUTPUT"

          if [ "${CHANGED_TOOLS}" = "[]" ] || [ -z "${CHANGED_TOOLS}" ]; then
            echo "has_tools=false" >> "$GITHUB_OUTPUT"
            echo "No tool changes detected."
          else
            echo "has_tools=true" >> "$GITHUB_OUTPUT"
            echo "Changed tools: ${CHANGED_TOOLS}"
          fi

  # ─── Per-Tool CI ─────────────────────────────────────────────────────────
  tool-ci:
    name: "CI: ${{ matrix.tool }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_tools == 'true'
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJson(needs.detect-changes.outputs.tools) }}
    uses: ./.github/workflows/tool-ci.yml
    with:
      tool-name: ${{ matrix.tool }}

  # ─── Repo-Level Checks ──────────────────────────────────────────────────
  repo-checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."
          find .github/workflows -name '*.yml' -exec echo "  ✅ {}" \;

      - name: Check for broken markdown links
        run: |
          echo "Checking markdown files exist..."
          for f in README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md; do
            if [ -f "$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ $f missing"
              exit 1
            fi
          done

      - name: Validate specs (structure check)
        run: |
          if [ -x scripts/validate-specs.sh ]; then
            bash scripts/validate-specs.sh
          else
            echo "ℹ️  No tools to validate yet."
          fi

  # ─── Docs Validation ────────────────────────────────────────────────────
  docs-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build documentation portal
        run: |
          chmod +x scripts/build-docs.sh
          bash scripts/build-docs.sh

      - name: Verify site bundle integrity
        run: |
          test -f _site/index.html
          test -f _site/style.css
          test -f _site/app.js
          echo "✅ Documentation site integrity verified."

