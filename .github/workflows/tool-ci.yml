# ============================================================================
# tool-ci.yml — Reusable Per-Tool CI Pipeline
#
# Called by ci.yml for each changed tool.
# Auto-detects language and runs appropriate lint/test/coverage.
# ============================================================================

name: Tool CI

on:
  workflow_call:
    inputs:
      tool-name:
        required: true
        type: string
        description: "Name of the tool directory under tools/"

jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/${{ inputs.tool-name }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect language & dependencies
        id: detect
        run: |
          TOOL_DIR="${GITHUB_WORKSPACE}/tools/${{ inputs.tool-name }}"

          # Polyglot detection (tools may combine Go + Bun, Python + Rust, etc.)
          if [ -f "$TOOL_DIR/pyproject.toml" ] || [ -f "$TOOL_DIR/requirements.txt" ] || \
             ls "$TOOL_DIR/src/"*.py 2>/dev/null 1>&2; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "$TOOL_DIR/go.mod" ] || [ -f "$TOOL_DIR/src/go.mod" ] || \
             ls "$TOOL_DIR/src/"*.go 2>/dev/null 1>&2; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "$TOOL_DIR/src/web/package.json" ] || [ -f "$TOOL_DIR/package.json" ]; then
            echo "has_bun=true" >> "$GITHUB_OUTPUT"
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "$TOOL_DIR/Cargo.toml" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
          fi

          if ls "$TOOL_DIR/src/"*.sh 2>/dev/null 1>&2; then
            echo "has_shell=true" >> "$GITHUB_OUTPUT"
          fi

      # ─── Bun Setup ───────────────────────────────────────────────────────
      - name: Set up Bun
        if: steps.detect.outputs.has_bun == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Bun dependencies
        if: steps.detect.outputs.has_bun == 'true'
        run: |
          if [ -f src/web/package.json ]; then
            cd src/web && bun install
          elif [ -f package.json ]; then
            bun install
          fi

      # ─── Go Setup ────────────────────────────────────────────────────────
      - name: Set up Go
        if: steps.detect.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Go dependencies
        if: steps.detect.outputs.has_go == 'true'
        run: |
          if [ -f src/go.mod ]; then
            cd src && go mod download
          elif [ -f go.mod ]; then
            go mod download
          fi

      # ─── Python Setup ────────────────────────────────────────────────────
      - name: Set up Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install ruff pytest pytest-cov

      # ─── Rust Setup ──────────────────────────────────────────────────────
      - name: Set up Rust
        if: steps.detect.outputs.has_rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # ─── Shell Setup ─────────────────────────────────────────────────────
      - name: Install ShellCheck
        if: steps.detect.outputs.has_shell == 'true'
        run: sudo apt-get install -y shellcheck

      # ─── Build ────────────────────────────────────────────────────────────
      - name: Build
        run: |
          if [ -f Makefile ] && grep -q '^build:' Makefile; then
            echo "🔨 Building ${{ inputs.tool-name }}..."
            make build
          else
            echo "ℹ️  No build target found, skipping build."
          fi

      # ─── Lint ─────────────────────────────────────────────────────────────
      - name: Lint
        run: |
          if [ -f Makefile ] && grep -q '^lint:' Makefile; then
            echo "🔍 Linting ${{ inputs.tool-name }}..."
            make lint
          else
            echo "ℹ️  No lint target found, skipping lint."
          fi

      # ─── Test ─────────────────────────────────────────────────────────────
      - name: Test
        run: |
          if [ -f Makefile ] && grep -q '^test:' Makefile; then
            echo "🧪 Testing ${{ inputs.tool-name }}..."
            make test
          else
            echo "ℹ️  No test target found, skipping test."
          fi

      # ─── Coverage (Python) ───────────────────────────────────────────────
      - name: Coverage Report (Python)
        if: steps.detect.outputs.has_python == 'true'
        run: |
          if [ -d tests ] && ls tests/test_*.py 2>/dev/null 1>&2; then
            python -m pytest tests/ --cov=src --cov-report=term-missing || true
          fi
        continue-on-error: true
