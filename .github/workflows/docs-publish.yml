# ============================================================================
# docs-publish.yml — Publish documentation to GitHub Pages
# ============================================================================

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/*/README.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build documentation index
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp README.md _site/index.md
          echo "Documentation built successfully"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
