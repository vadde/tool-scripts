name: ✨ Feature Request
description: Suggest an enhancement to an existing tool
title: "feat(<tool>): "
labels: ["enhancement"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Target Tool
      description: Which tool should this feature be added to?
      options:
        - "(Select a tool)"
        - "Repository-wide"
        - "New tool needed"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "I want to be able to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or examples.
    validations:
      required: false
